<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>
    <linearGradient id="egoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2980b9" />
      <stop offset="100%" stop-color="#3498db" />
    </linearGradient>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#e74c3c" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#e67e22" />
    </marker>
    <marker id="speedArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2ecc71" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="320" fill="#f8f9fa" rx="10" />

  <!-- Road Surface -->
  <rect x="30" y="160" width="790" height="110" fill="url(#roadGrad)" rx="6" />
  <!-- Road Lane Markings -->
  <line x1="40" y1="215" x2="810" y2="215" stroke="#ecf0f1" stroke-width="3" stroke-dasharray="25, 20" />
  <line x1="30" y1="165" x2="820" y2="165" stroke="#f1c40f" stroke-width="2" />
  <line x1="30" y1="265" x2="820" y2="265" stroke="#ffffff" stroke-width="2" />

  <!-- Ego Vehicle (Host) -->
  <g transform="translate(90, 180)">
    <!-- Body -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="url(#egoGrad)" stroke="#1f618d" stroke-width="2" />
    <!-- Cabin / Windows -->
    <path d="M 35 5 L 60 -18 L 110 -18 L 125 5 Z" fill="#d4e6f1" stroke="#1f618d" stroke-width="2" />
    <line x1="85" y1="-18" x2="85" y2="5" stroke="#1f618d" stroke-width="2" />
    <!-- Wheels -->
    <circle cx="30" cy="60" r="14" fill="#17202a" stroke="#7f8c8d" stroke-width="3" />
    <circle cx="110" cy="60" r="14" fill="#17202a" stroke="#7f8c8d" stroke-width="3" />
    <!-- Headlight & Sensor Beam -->
    <polygon points="140,15 230,-5 230,45 140,35" fill="#f1c40f" opacity="0.25" />
    <circle cx="140" cy="25" r="4" fill="#f39c12" />
    <!-- Label -->
    <text x="70" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">EGO VEHICLE</text>
  </g>

  <!-- Lead Vehicle (Target / Obstacle) -->
  <g transform="translate(610, 180)">
    <!-- Body -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="url(#leadGrad)" stroke="#922b21" stroke-width="2" />
    <!-- Cabin / Windows -->
    <path d="M 25 5 L 40 -18 L 90 -18 L 115 5 Z" fill="#fadbd8" stroke="#922b21" stroke-width="2" />
    <line x1="65" y1="-18" x2="65" y2="5" stroke="#922b21" stroke-width="2" />
    <!-- Wheels -->
    <circle cx="30" cy="60" r="14" fill="#17202a" stroke="#7f8c8d" stroke-width="3" />
    <circle cx="110" cy="60" r="14" fill="#17202a" stroke="#7f8c8d" stroke-width="3" />
    <!-- Taillight -->
    <rect x="-3" y="15" width="5" height="15" fill="#e74c3c" rx="1" />
    <!-- Label -->
    <text x="70" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">LEAD VEHICLE</text>
  </g>

  <!-- Distance Dimension Line (d) -->
  <g transform="translate(230, 115)">
    <!-- Dimension arrows -->
    <line x1="10" y1="0" x2="370" y2="0" stroke="#e67e22" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <!-- Witness lines -->
    <line x1="0" y1="-10" x2="0" y2="65" stroke="#7f8c8d" stroke-dasharray="3,3" stroke-width="1.5" />
    <line x1="380" y1="-10" x2="380" y2="65" stroke="#7f8c8d" stroke-dasharray="3,3" stroke-width="1.5" />
    <!-- Distance Label Box -->
    <rect x="130" y="-18" width="120" height="32" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.5" />
    <text x="190" y="3" fill="#d35400" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Distance d (m)</text>
  </g>

  <!-- Ego Speed Vector -->
  <g transform="translate(140, 95)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#27ae60" stroke-width="3" marker-end="url(#speedArrow)" />
    <text x="35" y="-8" fill="#1e8449" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">v_ego</text>
  </g>

  <!-- Lead Speed Vector -->
  <g transform="translate(670, 95)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#27ae60" stroke-width="3" marker-end="url(#speedArrow)" />
    <text x="20" y="-8" fill="#1e8449" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">v_lead</text>
  </g>

  <!-- Formula Callout Banner -->
  <g transform="translate(230, 25)">
    <rect x="0" y="0" width="390" height="58" rx="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5" />
    <text x="195" y="24" fill="#1b4f72" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      Closing Speed: v_closing = v_ego - v_lead
    </text>
    <text x="195" y="46" fill="#2874a6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      Time-To-Collision: TTC = d / v_closing
    </text>
  </g>
</svg>
